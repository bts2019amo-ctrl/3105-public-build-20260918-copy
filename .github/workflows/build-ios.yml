name: Build iOS app - X

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm Xcode 26 and iOS 26 SDK
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -q 'iOS 26'

      - name: Verify public mobile catalog integration
        run: |
          set -euo pipefail
          test -s ThreeOneOSFive/helpers/PatchProjectStore.swift
          grep -q 'RemotePatchConfiguration' ThreeOneOSFive/helpers/PatchProjectStore.swift
          grep -q 'api/mobile/catalog' ThreeOneOSFive/helpers/PatchProjectStore.swift
          if grep -Eq 'PatchSyncToken|patches\.feed|patches\.heartbeat' ThreeOneOSFive/helpers/PatchProjectStore.swift ThreeOneOSFive/Info.plist; then
            echo '::error::A integração do catálogo ainda referencia o protocolo legado.'
            exit 1
          fi
          wc -l -c ThreeOneOSFive/helpers/PatchProjectStore.swift

      - name: Build unsigned Release app
        run: |
          set -euo pipefail
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package app artifact
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/X.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$RUNNER_TEMP/X.ipa" Payload)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: x-ios-ipa
          path: |
            ${{ runner.temp }}/X.ipa
          if-no-files-found: error
          retention-days: 14
